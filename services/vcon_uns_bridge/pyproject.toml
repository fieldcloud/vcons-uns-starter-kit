[project]
name = "vcon-uns-bridge"
version = "0.1.0"
description = "vCon store -> MQTT UNS publisher (pointer + summary)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
  "requests>=2.31",
  "paho-mqtt>=2.0",
  "pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
