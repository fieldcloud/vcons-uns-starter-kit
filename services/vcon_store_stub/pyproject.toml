[project]
name = "vcon-store-stub"
version = "0.1.0"
description = "Minimal vCon Store REST API for OKF PoC (NOT production)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
